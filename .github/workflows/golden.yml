name: golden-result

on:
  pull_request:   # every PR, so the required check always reports
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run dvc repro
      - run: git diff --exit-code dvc.lock   # data hash must match the commit
      - run: uv run pytest tests/golden -v
